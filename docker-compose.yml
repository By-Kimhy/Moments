# Local services for development: PostgreSQL and Redis. Run with `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moments
      POSTGRES_PASSWORD: moments
      POSTGRES_DB: moments
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres:
